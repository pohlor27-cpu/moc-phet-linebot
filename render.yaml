services:
  - type: web
    name: line-daily-work-bot
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: OCR_PROVIDER
        value: gemini
      - key: MORNING_SCHEDULE_TIME
        value: "07:30"
      - key: DAILY_SUMMARY_TIME
        value: "17:05"
      - key: TIMEZONE
        value: Asia/Bangkok
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
